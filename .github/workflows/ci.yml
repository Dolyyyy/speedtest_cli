name: CI & Multi-Platform Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Verify Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.23']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run Unit Tests
        run: go test -v -race ./...

      - name: Build Local CLI Binary
        run: go build -o speedtest ./cmd/speedtest

  build-artifacts:
    name: Build Multi-Platform Release Binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run Multi-Platform Build Script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speedtest-binaries
          path: binaries/
